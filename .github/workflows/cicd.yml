name: HRDesk CI/CD Pipeline

# Trigger: Run this pipeline on push to main branch or pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # JOB 1: BUILD & TEST (Continuous Integration)
  # ============================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest # Use Ubuntu Linux VM

    steps:
      # Step 1: Checkout your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK (Java Development Kit)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Step 3: Build with Maven (compiles code, runs tests, creates WAR file)
      - name: Build with Maven
        run: mvn clean package

      # Step 4: Upload the built WAR file as artifact (so we can deploy it later)
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrdesk-war
          path: target/*.war

  # ============================================
  # JOB 2: DEPLOY (Continuous Deployment)
  # ============================================
  deploy:
    name: Deploy to Server
    needs: build # Only run after build job succeeds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy from main branch

    steps:
      # Step 1: Download the WAR file from build job
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: hrdesk-war
          path: target/

      # Step 2: Deploy to server (example using SCP/SFTP)
      # For beginners, we'll deploy to a simple server or use a free platform
      - name: Deploy to Server
        run: |
          echo "Deploying WAR file..."
          ls -la target/
          # We'll configure actual deployment in Step 4
