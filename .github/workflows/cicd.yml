name: HRDesk CI/CD Pipeline

# When to run this pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel old runs if a new push happens
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # JOB 1: BUILD & TEST (Compile Java code)
  # ═══════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (LTS - Long Term Support)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # 3. Build the project with Maven
      #    This compiles your Java code and creates a .war file
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Upload the built .war file so we can use it later
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrdesk-war
          path: target/*.war

  # ═══════════════════════════════════════
  # JOB 2: DEPLOY (Only runs on main branch)
  # ═══════════════════════════════════════
  deploy:
    name: Deploy to Server
    needs: build # Wait for build to succeed
    if: github.ref == 'refs/heads/main' # Only on main branch
    runs-on: ubuntu-latest

    steps:
      # 1. Download the .war file from the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hrdesk-war
          path: ./target

      # 2. Deploy to your Ubuntu server via SSH
      #    Replace with your actual server details
      - name: Deploy to Tomcat
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/*.war"
          target: "/opt/tomcat/webapps/"
          strip_components: 1

      # 3. Restart Tomcat to apply changes
      - name: Restart Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart tomcat
            echo "Deployment complete! HRDesk is live."
